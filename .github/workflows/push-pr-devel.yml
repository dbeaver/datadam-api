name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches: [devel]

jobs:
  build:
    uses: dbeaver/dbeaver-common/.github/workflows/mvn-package.yml@devel
    name: Check
    secrets: inherit
    with:
      project-directory: ./datadam-api/apis/aggregate
      project-deps: ./datadam-api/project.deps
      timeout-minutes: 2

  lint:
    uses: dbeaver/dbeaver-common/.github/workflows/java-checkstyle.yml@devel
    name: Check
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
